# The native export sidecar. Its own workspace, so the renderer workspace's
# lockfile, `cargo test --workspace` and the WASM build never compile wgpu's
# native backends.
[workspace]

[package]
name = "ms-export"
version = "0.0.1"
edition = "2024"
publish = false
description = "Native video export for Motion Script: replays a host's recorded renderer calls on a native wgpu device and encodes with ffmpeg (NVENC where present)."
license = "Apache-2.0"

[[bin]]
name = "ms-export"
path = "src/main.rs"

[dependencies]
ms-renderer = { path = "../renderer", features = ["native"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal"] }
pollster = "0.4"
bytemuck = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
debug = "line-tables-only"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
